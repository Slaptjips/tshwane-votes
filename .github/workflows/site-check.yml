name: Site check

# Loads the published GitHub Pages site from a runner: HTTP status of every file, headless-Chrome
# screenshots (desktop + phone) and browser console output. Results go to the `site-check` branch.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Site URL to check"
        required: false
        default: https://tshwane-votes.pages.dev

permissions:
  contents: write
  pages: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ inputs.url || 'https://tshwane-votes.pages.dev' }}
    steps:
      - name: Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          gh api "repos/${{ github.repository }}/pages" > out/pages.json 2>&1 || true
          gh api "repos/${{ github.repository }}/pages/builds/latest" > out/pages-build.json 2>&1 || true
          gh api "repos/${{ github.repository }}" --jq '{private, visibility, has_pages}' > out/repo.json 2>&1 || true
          cat out/pages.json out/repo.json
      - name: Request files
        run: |
          for p in "" assets/app.js assets/style.css vendor/leaflet/leaflet.js vendor/leaflet/leaflet.css \
                   data/static.json data/wards.geojson data/vds.geojson data/live.json data/live-history.json; do
            curl -s -o /dev/null -w "%{http_code} %{size_download}B /$p\n" "$BASE/$p?cb=$GITHUB_RUN_ID" | tee -a out/status.txt
          done
          curl -s "$BASE/data/live.json?cb=$GITHUB_RUN_ID" > out/live.json
      - name: Render in Chrome
        run: |
          shot() {
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --enable-logging=stderr --v=0 \
              --window-size="$1" --virtual-time-budget=20000 "${@:3}" "$BASE/?cb=$GITHUB_RUN_ID" 2>>"out/console-$2.txt" || true
          }
          shot 1440,900 desktop --screenshot=out/desktop.png
          shot 390,844 mobile --screenshot=out/mobile.png
          shot 1440,900 dom --dump-dom > out/dom.html
          grep -h "CONSOLE\|Uncaught" out/console-*.txt | grep -v "ERR_\|favicon" > out/console.txt || true
          wc -c out/*
      - name: Save results to the site-check branch
        run: |
          cd out
          git init -q -b site-check
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            add . && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Site check $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site-check
