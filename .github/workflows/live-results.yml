name: Live results

# Election night: every 5 minutes, pull the IEC's LGE 2026 results file for Gauteng, keep the
# Tshwane voting districts, and commit docs/data/live.json + live-history.json. Cloudflare redeploys the
# site on every push, and the page re-reads live.json every minute.
# Schedules run only from the default branch. GitHub can delay scheduled runs by several minutes;
# run "Run workflow" by hand (or sh pipeline/election_night.sh locally) if they lag.
on:
  schedule:
    - cron: "*/5 17-23 4 11 *"   # 4 Nov from 19:00 SAST (polls close 21:00 SAST)
    - cron: "*/5 * 5-7 11 *"     # 5-7 Nov, around the clock
  workflow_dispatch:
    inputs:
      src:
        description: "Override the IEC CSV URL (optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: live-results
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ingest IEC results
        env:
          SRC: ${{ inputs.src }}
        run: python3 pipeline/live.py ${SRC:+--src "$SRC"}
      - name: Commit live data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/live.json docs/data/live-history.json
          git diff --cached --quiet && exit 0
          git commit -qm "Live results $(date -u +%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
